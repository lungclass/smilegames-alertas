
name: Probar Telegram

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje de prueba
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": "✅ ¡Prueba exitosa! Las alertas de SmileGames están conectadas a Telegram."
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if not result.get("ok"):
              raise RuntimeError("Telegram no confirmó el mensaje.")

          print("Mensaje de prueba enviado correctamente.")
          PY
